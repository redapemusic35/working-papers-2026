project:
  type: book
  output-dir: _book

book:
  title: "Working Papers 2026"
  author: "Montaque Reynolds"
  date: "last-modified"               # auto-updates
  reader-mode: true                   # nice sidebar TOC
  search: true
  repo-url: https://github.com/yourname/working-papers-2026  # optional
  repo-actions: [edit, source]
  chapters:
    - index.qmd
    - part: "Active Papers"
      chapters:
        - ./papers/paper-1-aes-evi/index.qmd
        - ./papers/paper-2-morality-as-privilege/index.qmd
        - ./papers/paper-1-moral-privilege/index.qmd
        - ./papers/paper-2-van-camp-comments/index.qmd
        #- papers/paper3-ethics-ai/ethics-ai-draft.qmd
    - part: "Puzzles and Mysteries"
      chapters:
        - ./papers/book-puzzles-mysteries/index.qmd
    - part: "Drafts & Notes"
      chapters:
        - ./papers/notes/index.qmd
        # add more as needed
bibliography: ["./references.bib", "./Un-Duplicates.bib"]
  #csl: chicago-author-date.csl        # or use biblatex-chicago for philosophy

format:
  html:
    theme: cosmo                      # clean & academic
    highlight-style: tango
    #css: styles.css                   # optional custom style
    include-in-header:
      text: |
        <script>
        document.addEventListener("DOMContentLoaded", () => {
          const btn = document.createElement("button");
          btn.innerHTML = "🖨️ Print / Save as PDF";
          btn.className = "btn btn-primary";
          btn.style.position = "fixed";
          btn.style.bottom = "20px";
          btn.style.right = "20px";
          btn.style.zIndex = "1000";
          btn.style.padding = "0.8em 1.2em";
          btn.style.fontSize = "1.1em";
          btn.onclick = () => window.print();
          document.body.appendChild(btn);
        });
        </script>
  pdf:
    documentclass: scrreprt           # nice book-like PDF
    keep-tex: true
  docx: default

execute:
  echo: false
  freeze: auto                        # only re-execute changed files
